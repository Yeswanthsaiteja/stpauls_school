<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- Mobile-optimised viewport: prevents zoom, fills entire screen -->
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
        <meta name="theme-color" content="#4f46e5" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="description" content="St. Paul's High School — Institutional Management Suite" />

        <!-- PWA Manifest -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

        <!-- Favicon — school logo -->
        <link rel="icon" type="image/png" href="%PUBLIC_URL%/school-logo.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/school-logo.png" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet" />

        <!-- Safe-area insets for notch/home-indicator on phones -->
        <style>
          :root {
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-left: env(safe-area-inset-left, 0px);
            --safe-area-right: env(safe-area-inset-right, 0px);
          }
          /* Prevent overscroll bounce on mobile */
          html, body {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
          }
          /* Hide browser scrollbars on Android WebView */
          ::-webkit-scrollbar { display: none; }
        </style>

        <title>St. Paul's High School ERP</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
